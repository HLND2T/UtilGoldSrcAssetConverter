name: clang-format

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install clang-format==23.1.3
      - name: Configure formatting targets
        run: cmake -S . -B build/format -DFORMAT_VALIDATION_ONLY=ON
      - name: Check include/, src/ and tests/
        run: cmake --build build/format --target format-check
